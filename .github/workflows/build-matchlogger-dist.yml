name: Build MatchLogger install zips

# The console's install buttons link to matchlogger/dist/*.zip. This keeps
# those zips in sync with the mod/sender source whenever either changes, the
# same "commit the built artifact" pattern as build-wasm.yml.
on:
  push:
    branches: [main]
    paths:
      - "matchlogger/ue4ss/**"
      - "matchlogger/sender/**"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: matchlogger-dist
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build zips
        run: |
          set -euo pipefail
          mkdir -p matchlogger/dist

          # rivals-station-reporter.zip: the launcher sits alone at the zip root
          # (the only thing you need to double-click); everything else is tucked
          # into _internal/ so extracting doesn't dump a pile of loose files next
          # to it. rivals-station-reporter.pyw finds _internal/ next to itself at
          # runtime, so no source patching is needed to build it this way.
          stage=$(mktemp -d)
          cp matchlogger/sender/rivals-station-reporter.pyw "$stage/"
          mkdir "$stage/_internal"
          # Every runtime module, not a hand-kept list: the app has grown
          # rivals_stats/dashboard/matching/hub/startgg, and a missing one only
          # shows up as an ImportError on the user's machine. Tests stay out.
          cp matchlogger/sender/*.py "$stage/_internal/"
          rm -f "$stage/_internal"/test_*.py
          cp matchlogger/sender/config.example.json matchlogger/sender/players.example.json \
             matchlogger/sender/README.md "$stage/_internal/"

          # Guard: don't ship a zip that crashes on launch (this is exactly how
          # rivals_stats went missing). Two checks, neither needing tkinter —
          # the runner's Python has no GUI toolkit and never needs one:
          #  1. every staged file compiles;
          #  2. every local module an app file imports is actually in the zip.
          STAGE="$stage" SRC="matchlogger/sender" python - <<'PY'
          import ast, os, sys

          stage = os.path.join(os.environ['STAGE'], '_internal')
          src = os.environ['SRC']
          local = {f[:-3] for f in os.listdir(src)
                   if f.endswith('.py') and not f.startswith('test_')}
          staged = {f[:-3] for f in os.listdir(stage) if f.endswith('.py')}

          problems = []
          for f in sorted(os.listdir(stage)):
              if not f.endswith('.py'):
                  continue
              path = os.path.join(stage, f)
              try:
                  tree = ast.parse(open(path, encoding='utf-8').read())
              except SyntaxError as e:
                  problems.append('%s does not parse: %s' % (f, e))
                  continue
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      names = [a.name.split('.')[0] for a in node.names]
                  elif isinstance(node, ast.ImportFrom) and not node.level and node.module:
                      names = [node.module.split('.')[0]]
                  else:
                      continue
                  for n in names:
                      if n in local and n not in staged:
                          problems.append('%s imports %s, which is not in the zip' % (f, n))

          if problems:
            print('ZIP WOULD BE BROKEN:')
            for p in sorted(set(problems)):
                print('  -', p)
            sys.exit(1)
          print('zip check OK: %d modules, imports all satisfied' % len(staged))
          PY

          (cd "$stage" && zip -r -X "$GITHUB_WORKSPACE/matchlogger/dist/rivals-station-reporter.zip" rivals-station-reporter.pyw _internal)
          rm -rf "$stage"

      - name: Commit if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add matchlogger/dist/rivals-station-reporter.zip
          if git diff --cached --quiet; then
            echo "No changes to the install zips."
            exit 0
          fi
          git commit -m "chore: rebuild MatchLogger install zips"
          git push
